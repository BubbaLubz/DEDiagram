name: Keep Render service alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed app
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://dediagram.onrender.com/api/auth/me)
          echo "Response status: $status"
          if [ "$status" -ge 500 ]; then
            echo "Server error response"
            exit 1
          fi
